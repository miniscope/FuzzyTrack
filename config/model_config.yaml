model:
  backbone: resnet50  # resnet18 or resnet50
  use_heatmap: true   # true for heatmap mode, false for regression

heatmap:
  sigma: 5.0  # Gaussian sigma for target heatmap

training:
  batch_size: 64
  epochs: 200
  patience: 20
  learning_rate: 0.0005
  val_split: 0.2
  num_workers: 4
  pin_memory: true

tracking:
  smoothing: 0.5          # EMA smoothing (0.0-1.0, lower=smoother, 1.0=no smoothing)
  min_confidence: 0.5     # Min confidence for valid zone transitions
  min_confidence_forbidden: 0.8  # Min confidence for forbidden transitions
  min_frames_same: 1      # Min frames in zone before switching
  # max_speed: 0.1        # Uncomment to limit movement speed (normalized 0-1 per frame)
