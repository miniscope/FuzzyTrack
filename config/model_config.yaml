model:
  backbone: resnet50  # resnet18 or resnet50
  use_heatmap: true   # true for heatmap mode, false for regression

heatmap:
  sigma: 3.0  # Gaussian sigma for target heatmap (increased for smoother targets)

training:
  batch_size: 8  # Reduced from 64 to get more batches/epoch (720/8=90 batches vs 11)
  epochs: 1000
  patience: 50
  learning_rate: 0.0005
  val_split: 0.2
  num_workers: 8
  pin_memory: true
  cache_frames: true

tracking:
  smoothing: 0.2          # EMA smoothing (0.0-1.0, lower=smoother, 1.0=no smoothing)
  min_confidence: 0.4     # Min confidence for valid zone transitions
  min_confidence_forbidden: 0.9  # Min confidence for forbidden transitions
  min_frames_same: 1      # Min frames in zone before switching
  min_frames_forbidden: 10  # Min consecutive frames above threshold for forbidden transitions
  enable_warmup: true
  warmup_frames_heatmap: 30
  warmup_frames_regression: 5
  min_warmup_confident_frames_heatmap: 10
  min_warmup_confident_frames_regression: 3
  heatmap_min_confidence: 0.4  # Min heatmap confidence during warmup (entropy-based, 0=uniform, 1=peaked)
  # max_speed: 0.1        # Uncomment to limit movement speed (normalized 0-1 per frame)
