[project]
name = "mousetrack"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "t-sasatani" }
]

dependencies = [
  "torch",
  "torchvision",
  "pandas",
  "numpy",
  "opencv-python",
  "pyyaml",
  "tensorboard>=2.20.0",
  "click>=8.0.0",
]

[project.scripts]
mousetrack = "mousetrack.cli:cli_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mousetrack"]

[tool.uv]
package = true
