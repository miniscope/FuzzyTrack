[project]
name = "fuzzytrack"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "t-sasatani" }
]

dependencies = [
  "torch",
  "torchvision",
  "pandas",
  "numpy",
  "opencv-python",
  "pyyaml",
  "tensorboard>=2.20.0",
  "click>=8.0.0",
  "tqdm",
]

[dependency-groups]
dev = [
  "black>=24.0.0",
  "ruff>=0.6.0",
]

[project.scripts]
fuzzytrack = "mousetrack.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mousetrack"]

[tool.uv]
package = true

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "B",
  "UP",
]
ignore = [
  "E501",
]
